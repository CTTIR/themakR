url: https://cttir.github.io/themakR/

template:
  includes:
    in_header: |
      <meta name="theme-color" content="#1565c0">
      <script defer data-domain="cttir.github.io/themakr" src="https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"></script>
  package: themakR        # self-hosting: themakR's site is themed by itself

development:
  mode: auto

# The shared navbar has no "Get started" entry, so the adoption guide
# (vignettes/themakR.Rmd) would be missing from the menu of this site. This is
# the per-package override the guide describes.
navbar:
  structure:
    left:  []
    right: [search, intro, reference, articles, news, github, lightswitch]

reference:
- title: Demo content
  desc: >
    Placeholder reference content so the template can render a preview of
    itself. Not part of the theming API.
  contents:
  - tk_demo

articles:
- title: Using themakR
  navbar: ~
  contents:
  - themakR
  - showcase
